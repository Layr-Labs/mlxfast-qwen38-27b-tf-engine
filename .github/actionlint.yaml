# actionlint configuration.
#
# actionlint validates `runs-on` against the labels GitHub itself provides and
# rejects anything else, so a self-hosted label has to be declared here or the
# ranked workflow fails the `lint` job on a label that is correct.
# Keep the first label equal to the track ID in the ranked workflow.
self-hosted-runner:
  labels:
    - qwen3.8-27b-tf-mlx-v1
    # Control plane checks can run on Darkbloom Sandboxes through
    # .github/workflows/darkbloom-route.yml. Darkbloom Sandboxes also carry
    # the built-in self-hosted, linux or macOS, and ARM64 labels.
    - darkbloom-linux-arm64
    - darkbloom-macos-arm64
