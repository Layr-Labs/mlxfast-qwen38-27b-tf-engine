name: Control plane checks

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Chooses a Darkbloom Sandbox or the GitHub-hosted fallback for each job
  # below (docs/ci-coverage.md, "Runner routing"). Routing is off unless the
  # repository variable DARKBLOOM_ROUTING is exactly `on`. The route job never
  # fails the run.
  route:
    uses: ./.github/workflows/darkbloom-route.yml
    permissions: {}
    with:
      lanes: |
        lint linux_arm64 ubuntu-latest
        macos-security macos_arm64 macos-15

  lint:
    name: Hosted security and syntax
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['lint'] }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: No credential or unapproved artifact egress
        run: tools/ci-workflow-egress-scan.sh

      # The GitHub-hosted image has ShellCheck 0.9.0 and the Darkbloom image has
      # none. Install the same pinned 0.9.0 on both, so that actionlint checks
      # run blocks the same way on both. The release has no checksums file; the
      # two digests are of the release assets.
      - name: ShellCheck for actionlint
        env:
          SHELLCHECK_VERSION: 0.9.0
          SHELLCHECK_SHA256_X86_64: 700324c6dd0ebea0117591c6cc9d7350d9c7c5c287acbad7630fa17b1d4d9e2f
          SHELLCHECK_SHA256_AARCH64: 179c579ef3481317d130adebede74a34dbbc2df961a70916dd4039ebf0735fae
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=x86_64; sha256="${SHELLCHECK_SHA256_X86_64}" ;;
            aarch64) arch=aarch64; sha256="${SHELLCHECK_SHA256_AARCH64}" ;;
            *) echo "::error::no pinned ShellCheck for $(uname -m)" >&2; exit 1 ;;
          esac
          workdir="${RUNNER_TEMP}/shellcheck"
          mkdir -p "${workdir}"
          tarball="${workdir}/shellcheck.tar.xz"
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.${arch}.tar.xz"
          curl --fail --silent --show-error --location --retry 3 -o "${tarball}" "${url}"
          printf '%s  %s\n' "${sha256}" "${tarball}" | sha256sum --check --status
          tar -xJf "${tarball}" -C "${workdir}" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          chmod +x "${workdir}/shellcheck"
          "${workdir}/shellcheck" --version
          echo "${workdir}" >> "${GITHUB_PATH}"

      # Linux amd64 on GitHub-hosted runners, linux arm64 on Darkbloom. Both
      # digests are from actionlint_1.7.12_checksums.txt.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256_AMD64: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_SHA256_ARM64: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64; sha256="${ACTIONLINT_SHA256_AMD64}" ;;
            aarch64) arch=arm64; sha256="${ACTIONLINT_SHA256_ARM64}" ;;
            *) echo "::error::no pinned actionlint for $(uname -m)" >&2; exit 1 ;;
          esac
          workdir="$(mktemp -d)"
          tarball="${workdir}/actionlint.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz"
          curl --fail --silent --show-error --location --retry 3 -o "${tarball}" "${url}"
          printf '%s  %s\n' "${sha256}" "${tarball}" | sha256sum --check --status
          tar -xzf "${tarball}" -C "${workdir}" actionlint
          chmod +x "${workdir}/actionlint"
          "${workdir}/actionlint" -color

      - name: Shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            case "$(head -n 1 "${script}")" in
              '#!/usr/bin/env bash'|'#!/bin/bash') bash -n "${script}" ;;
              '#!/usr/bin/env sh'|'#!/bin/sh') sh -n "${script}" ;;
              *) echo "unsupported shell script: ${script}" >&2; exit 1 ;;
            esac
          done < <(git ls-files -z '*.sh' ':!:Vendor/TensorFold/**')

      - name: JSON and manifest lint
        run: |
          jq . benchmark.json >/dev/null
          jq . fixtures/qwen3_8_27b_tf_mlx_v1_track.json >/dev/null
          python3 tools/lint-benchmark-manifest.py --gitlink-targets report

      - name: Editable surface archive size
        run: tools/check-editable-surface-size.sh

      - name: Workflow egress tests
        run: tools/ci-workflow-egress-scan.sh

  macos-security:
    name: macOS Seatbelt and offline tests
    needs: [route, lint]
    runs-on: ${{ fromJSON(needs.route.outputs.routes)['macos-security'] }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Seatbelt is available
        run: test -x /usr/bin/sandbox-exec

      - name: Submission-security suite did not shrink
        run: |
          set -euo pipefail
          tools/test-submission-security.sh | tee "${RUNNER_TEMP}/submission-security.log"
          grep -Eq 'submission-security: ([2-9][0-9]{2}|[1-9][0-9]{3,}) distinct cases, 0 failures' "${RUNNER_TEMP}/submission-security.log"

      - name: TEMPORARY sandboxed-build trace
        run: |
          set +e
          SHELLOPTS=xtrace bash tools/test-sandboxed-build.sh > "${RUNNER_TEMP}/trace.log" 2>&1
          echo "rc=$?"
          grep -v "system agent passed" "${RUNNER_TEMP}/trace.log" | tail -n 120

      - name: Real Seatbelt containment
        run: |
          tools/test-orphan-guard.sh
          tools/test-noindex-profiles.sh
          tools/test-sandboxed-build.sh
          tools/test-sandboxed-cli.sh
          tools/test-resident-up.sh

      - name: Public ranked logs hide host paths
        run: tools/test-public-log-paths.sh

      - name: All offline control-plane tests
        run: |
          set -uo pipefail
          failed=()
          for test_file in tools/test-*.sh; do
            echo "::group::${test_file}"
            bash "${test_file}" || failed+=("${test_file}")
            echo "::endgroup::"
          done
          if (( ${#failed[@]} )); then printf '::error::failed: %s\n' "${failed[@]}"; exit 1; fi
